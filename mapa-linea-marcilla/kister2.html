<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa interactivo Kister 2 - Parada Técnica</title>
<style>
:root{
  --orange:#FD980D; --green:#00B354; --dark:#1a1d23; --panel:#22262e;
  --panel2:#2a2f38; --text:#eef1f5; --muted:#9aa4b2; --border:#3a4049;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--dark);color:var(--text);}
header{padding:18px 24px;background:linear-gradient(90deg,#1a1d23,#20242c);border-bottom:3px solid var(--orange);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header h1{font-size:20px;margin:0;font-weight:700;}
header h1 span{color:var(--orange);}
header .sub{color:var(--muted);font-size:13px;margin-top:4px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;}
button:hover{border-color:var(--orange);color:var(--orange);}
button.primary{background:var(--orange);border-color:var(--orange);color:#1a1d23;}
button.primary:hover{background:#ffab2e;color:#1a1d23;}
.layout{display:flex;gap:0;height:calc(100vh - 78px);}
.mapwrap{flex:1;position:relative;overflow:auto;background:#0e1013;padding:20px;}
.planowrap{position:relative;display:inline-block;min-width:1100px;}
.planowrap img{width:100%;display:block;border-radius:6px;box-shadow:0 0 0 1px var(--border);}
.hotspot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--orange);border:3px solid #fff;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1a1d23;}
.hotspot:hover{background:var(--green);}
.hotspot.dragging{cursor:grabbing;z-index:50;}
.hotspot .tip{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-weight:600;}
.hotspot:hover .tip{opacity:1;}
aside{width:340px;min-width:340px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;}
.side-header{padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2;}
.side-header input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;}
.zone-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s;}
.zone-item:hover{background:var(--panel2);}
.zone-item .zname{font-weight:700;font-size:13px;}
.zone-item .zmeta{color:var(--muted);font-size:11px;margin-top:3px;}
.badge{display:inline-block;background:var(--orange);color:#1a1d23;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:6px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:30px;}
.modal-bg.open{display:flex;}
.modal{background:var(--panel);border-radius:10px;max-width:1100px;width:100%;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;border-top:4px solid var(--green);}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.modal-head h2{margin:0;font-size:18px;}
.modal-head .mmeta{color:var(--muted);font-size:12px;margin-top:4px;}
.modal-body{overflow:auto;padding:16px 22px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--panel2);color:var(--orange);text-align:left;padding:6px 8px;position:sticky;top:0;white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:#262b33;}
.code-badge{display:inline-block;min-width:20px;text-align:center;padding:2px 6px;border-radius:4px;font-weight:800;font-size:11px;}
.c-X{background:#3a4b2e;color:#a4e067;}
.c-Y{background:#4a3030;color:#e08a8a;}
.c-P{background:#3a3a2e;color:#e0d867;}
.c-C{background:#2e3a4a;color:#7fb3e0;}
.c-R{background:#3a2e4a;color:#c07fe0;}
.c-A{background:#2e4a45;color:#7fe0c9;}
.c-D{background:#4a3a2e;color:#e0a87f;}
.closebtn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
.closebtn:hover{color:var(--orange);}
.legend{padding:12px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;}
.legend b{color:var(--text);}
.allview{display:none;padding:20px 30px;}
.allview.open{display:block;}
.allview .zsection{margin-bottom:34px;}
.allview .zsection h2{color:var(--orange);border-bottom:2px solid var(--border);padding-bottom:6px;}
.hint{color:var(--muted);font-size:12px;padding:8px 22px 0;}

.corner-panel{position:fixed;top:90px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:60;}
.corner-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.4);min-width:230px;transition:.15s;}
.corner-btn:hover{border-color:var(--orange);}
.corner-btn .cbadge{background:var(--orange);color:#1a1d23;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:800;}
.corner-btn.comp .cbadge{background:var(--green);}
.corner-btn.comp{border-color:var(--green);}
.big-modal .modal{max-width:1300px;}
.check-yes{color:var(--green);font-weight:900;font-size:15px;}
.check-no{color:var(--muted);font-size:15px;}
.uncertain-mark{color:#e0d867;font-size:10px;margin-left:3px;}
.coincide-badge{font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;}
.coincide-0{background:#33383f;color:var(--muted);}
.coincide-1{background:#3a3a2e;color:#e0d867;}
.coincide-2{background:#3a4b2e;color:#a4e067;}
.coincide-3{background:#2e4a3a;color:#00e07a;}
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.filterbar input{padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;flex:1;min-width:180px;}
.filterbar .count{color:var(--muted);font-size:12px;}
</style>
</head>

    <button id="btnExport">Exportar coordenadas ajustadas (JSON)</button>
    <button class="primary" id="btnMapView">Vista plano</button>
  </div>
</header>

<script>
const ZONES = JSON.parse(document.getElementById('zonesData').textContent);
const YEAR_LABELS = ["2020", "2021", "2022", "2023", "2024 Feb", "2024 Oct", "2025 Mar", "2026 Mar", "Quesada 26", "2027 Mar"];
const LEYENDA = {"X": "Material previsto en la parada. Pedir precio y revisar tras recibir oferta", "Y": "Material previsto pero descartado en la segunda revisión", "P": "Pedir precio; se decide tras recibir la oferta", "C": "Realizar comprobación (leer nota junto a la pieza)", "R": "No pedir precio, revisar estado en la parada", "A": "Pedir para almacén", "D": "Delayed: se retrasa al siguiente año / pasa a revisión"};
let coords = {};
ZONES.forEach(z => coords[z.zona] = {x:z.x, y:z.y});

function renderHotspots(){
  const planowrap = document.getElementById('planowrap');
  planowrap.querySelectorAll('.hotspot').forEach(h=>h.remove());
  ZONES.forEach((z, idx) => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.style.left = (coords[z.zona].x*100)+'%';
    el.style.top = (coords[z.zona].y*100)+'%';
    el.dataset.zona = z.zona;
    el.innerHTML = '<span>'+(idx+1)+'</span><div class="tip">'+z.zona+' ('+z.piezas.length+')</div>';
    let dragging = false;
    el.addEventListener('mousedown', e=>{
      dragging = true; el.classList.add('dragging'); e.preventDefault();
    });
    document.addEventListener('mousemove', e=>{
      if(!dragging) return;
      const rect = planowrap.getBoundingClientRect();
      let x = (e.clientX - rect.left)/rect.width;
      let y = (e.clientY - rect.top)/rect.height;
      x = Math.min(1,Math.max(0,x)); y = Math.min(1,Math.max(0,y));
      coords[z.zona] = {x,y};
      el.style.left = (x*100)+'%'; el.style.top = (y*100)+'%';
    });
    document.addEventListener('mouseup', ()=>{
      if(dragging){dragging=false; el.classList.remove('dragging');}
    });
    el.addEventListener('click', e=>{
      if(!el.classList.contains('dragging')) openModal(z.zona);
    });
    planowrap.appendChild(el);
  });
}

function renderZoneList(filter){
  const list = document.getElementById('zoneList');
  list.innerHTML = '';
  filter = (filter||'').toLowerCase();
  ZONES.forEach(z=>{
    let match = z.zona.toLowerCase().includes(filter);
    if(!match && filter){
      match = z.piezas.some(p => (p.descripcion||'').toLowerCase().includes(filter) || (p.codigo||'').toLowerCase().includes(filter));
    }
    if(filter && !match) return;
    const div = document.createElement('div');
    div.className = 'zone-item';
    div.innerHTML = '<div class="zname">'+z.zona+'<span class="badge">'+z.piezas.length+'</span></div><div class="zmeta">'+(z.modulo_label||'')+'</div>';
    div.addEventListener('click', ()=>openModal(z.zona));
    list.appendChild(div);
  });
}

function codeBadge(code){
  if(!code) return '';
  const c = code.trim().toUpperCase();
  const cls = 'c-'+(['X','Y','P','C','R','A','D'].includes(c)?c:'X');
  const title = LEYENDA[c] || '';
  return '<span class="code-badge '+cls+'" title="'+title+'">'+code+'</span>';
}

function openModal(zonaName){
  const z = ZONES.find(zz=>zz.zona===zonaName);
  document.getElementById('modalTitle').textContent = z.zona;
  document.getElementById('modalMeta').textContent = (z.modulo_label||'') + (z.pagina_sub ? ' · pág. despiece Excel: '+z.pagina_sub : '') + ' · '+z.piezas.length+' piezas';
  const head = document.getElementById('tableHead');
  head.innerHTML = '<th>Pos.</th><th>Código</th><th>Descripción</th><th>UDS</th><th>Periodo/Gama</th>' +
    YEAR_LABELS.map(y=>'<th>'+y+'</th>').join('') + '<th>Observaciones</th>';
  const body = document.getElementById('tableBody');
  body.innerHTML = z.piezas.map(p=>{
    let row = '<tr>';
    row += '<td>'+(p.posicion??'')+'</td>';
    row += '<td>'+(p.codigo??'')+'</td>';
    row += '<td>'+(p.descripcion??'')+'</td>';
    row += '<td>'+(p.uds??'')+'</td>';
    row += '<td>'+(p.periodo??'')+'</td>';
    YEAR_LABELS.forEach(y=>{ row += '<td>'+codeBadge(p.years[y])+'</td>'; });
    row += '<td>'+(p.observaciones||[]).join(' · ')+'</td>';
    row += '</tr>';
    return row;
  }).join('');
  const legendBar = document.getElementById('legendBar');
  legendBar.innerHTML = Object.entries(LEYENDA).map(([k,v])=>'<span>'+codeBadge(k)+' <b>'+k+'</b>: '+v+'</span>').join('');
  document.getElementById('modalBg').classList.add('open');
}
document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('open'); });

document.getElementById('searchBox').addEventListener('input', e=>renderZoneList(e.target.value));

document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(coords, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'coordenadas_kister2_ajustadas.json';
  a.click();
});

document.getElementById('btnAll').addEventListener('click', ()=>{
  document.getElementById('mapView').style.display='none';
  const av = document.getElementById('allView');
  av.innerHTML = ZONES.map(z=>{
    let head = '<th>Pos.</th><th>Código</th><th>Descripción</th><th>UDS</th><th>Periodo/Gama</th>' +
      YEAR_LABELS.map(y=>'<th>'+y+'</th>').join('') + '<th>Observaciones</th>';
    let rows = z.piezas.map(p=>{
      let row = '<tr><td>'+(p.posicion??'')+'</td><td>'+(p.codigo??'')+'</td><td>'+(p.descripcion??'')+'</td><td>'+(p.uds??'')+'</td><td>'+(p.periodo??'')+'</td>';
      YEAR_LABELS.forEach(y=>{ row += '<td>'+codeBadge(p.years[y])+'</td>'; });
      row += '<td>'+(p.observaciones||[]).join(' · ')+'</td></tr>';
      return row;
    }).join('');
    return '<div class="zsection"><h2>'+z.zona+'</h2><div style="color:var(--muted);font-size:12px;margin-bottom:8px;">'+(z.modulo_label||'')+' · '+z.piezas.length+' piezas</div><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join('');
  av.classList.add('open');

function yn(flag, uncertain){
  if(flag===true) return '<span class="check-yes">✔</span>'+(uncertain?'<span class="uncertain-mark">?</span>':'');
  if(flag==='ND') return '<span class="check-no">–</span>';
  return '<span class="check-no">–</span>';
}

const nGama = COMPARATIVA.filter(r=>r.gama_toca===true).length;
const nKhs = COMPARATIVA.filter(r=>r.khs_flag).length;
const nMtto = COMPARATIVA.filter(r=>r.mtto_flag).length;
const nComp = COMPARATIVA.filter(r=>r.gama_toca===true || r.khs_flag || r.mtto_flag).length;
document.getElementById('badgeGama').textContent = nGama;
document.getElementById('badgeKhs').textContent = nKhs;
document.getElementById('badgeMtto').textContent = nMtto;
document.getElementById('badgeComp').textContent = nComp;

let currentCritMode = null;

function openCritModal(mode){
  currentCritMode = mode;
  const bg = document.getElementById('critModalBg');
  bg.classList.add('open');
  document.getElementById('critFilter').value = '';
  renderCritTable('');
}
document.getElementById('critClose').addEventListener('click', ()=>document.getElementById('critModalBg').classList.remove('open'));
document.getElementById('critModalBg').addEventListener('click', e=>{ if(e.target.id==='critModalBg') e.currentTarget.classList.remove('open'); });
document.getElementById('critFilter').addEventListener('input', e=>renderCritTable(e.target.value));

function renderCritTable(filter){
  filter = (filter||'').toLowerCase();
  const head = document.getElementById('critHead');
  const body = document.getElementById('critBody');
  const title = document.getElementById('critTitle');
  const meta = document.getElementById('critMeta');

  let rows = COMPARATIVA;
  if(currentCritMode === 'gama') rows = rows.filter(r=>r.gama_toca===true);
  if(currentCritMode === 'khs') rows = rows.filter(r=>r.khs_flag);
  if(currentCritMode === 'mtto') rows = rows.filter(r=>r.mtto_flag);
  if(currentCritMode === 'comp') rows = rows.filter(r=>r.gama_toca===true || r.khs_flag || r.mtto_flag);

  if(filter){
    rows = rows.filter(r => (r.descripcion||'').toLowerCase().includes(filter) ||
      (r.zona||'').toLowerCase().includes(filter) || (r.codigo||'').toLowerCase().includes(filter));
  }

  document.getElementById('critCount').textContent = rows.length + ' piezas';

  if(currentCritMode === 'comp'){
    title.textContent = 'Comparativa: gama vs KHS/proveedor vs mantenimiento';
    meta.textContent = 'Unión de piezas marcadas por al menos 1 de las 3 fuentes (' + nComp + ' en total). Ordenadas por nº de fuentes que coinciden.';
    head.innerHTML = '<th>Subcomponente</th><th>Descripción</th><th>Código</th><th>Gama</th><th>KHS/Prov.</th><th>Mtto</th><th>Coinciden</th>';
    rows = rows.slice().sort((a,b)=>{
      const na = (a.gama_toca===true?1:0)+(a.khs_flag?1:0)+(a.mtto_flag?1:0);
      const nb = (b.gama_toca===true?1:0)+(b.khs_flag?1:0)+(b.mtto_flag?1:0);
      return nb-na;
    });
    body.innerHTML = rows.map(r=>{
      const n = (r.gama_toca===true?1:0)+(r.khs_flag?1:0)+(r.mtto_flag?1:0);
      return '<tr><td>'+r.zona+'</td><td>'+(r.descripcion||'')+'</td><td>'+(r.codigo||'')+'</td>'+
        '<td>'+yn(r.gama_toca, r.gama_uncertain)+'</td><td>'+yn(r.khs_flag)+'</td><td>'+yn(r.mtto_flag)+'</td>'+
        '<td><span class="coincide-badge coincide-'+n+'">'+n+' / 3</span></td></tr>';
    }).join('');
  } else {
    const titles = {gama:'Según la gama (periodo de cambio)', khs:'Según KHS / proveedor (col. Quesada 26)', mtto:'Según mantenimiento (X en 27M / 27Q)'};
    const metas = {
      gama:'Piezas cuyo periodo de cambio (col. I) ya se habría cumplido según horas acumuladas hasta 27Q, o marcadas "Quesada" sin cambio reciente en 25-27.',
      khs:'Piezas con marca X del técnico de KHS (Quesada) en la revisión de 2026.',
      mtto:'Piezas marcadas con X por mantenimiento en las paradas 27M o 27Q.'
    };
    title.textContent = titles[currentCritMode];
    meta.textContent = metas[currentCritMode];
    head.innerHTML = '<th>Subcomponente</th><th>Descripción</th><th>Código</th><th>Detalle</th>';
    body.innerHTML = rows.map(r=>{
      let detail = currentCritMode==='gama' ? r.gama_detail : currentCritMode==='khs' ? ('Código: '+(r.khs_code||'')) : r.mtto_detail;
      return '<tr><td>'+r.zona+'</td><td>'+(r.descripcion||'')+'</td><td>'+(r.codigo||'')+'</td><td>'+(detail||'')+'</td></tr>';
    }).join('');
  }
}

document.getElementById('btnGama').addEventListener('click', ()=>openCritModal('gama'));
document.getElementById('btnKhs').addEventListener('click', ()=>openCritModal('khs'));
document.getElementById('btnMtto').addEventListener('click', ()=>openCritModal('mtto'));
document.getElementById('btnComp').addEventListener('click', ()=>openCritModal('comp'));
</script>
